# 이어 돌리기 (코랩 등에서 끊긴 실행을 체크포인트부터 다시 시작)
enabled: true         # false면 체크포인트를 저장하지도, 불러오지도 않는다
dir: null             # 체크포인트 폴더. null이면 <metrics.results_dir>/checkpoints (코랩에서는 드라이브)
every: 10             # N라운드마다 저장. 끊기면 최대 N-1라운드를 다시 돈다
keep_final: false     # 학습이 끝나면 체크포인트를 지운다(실행당 약 130MB라 드라이브 용량을 아낀다)
strict: true          # 저장할 때와 설정이 다르면 멈춘다. false면 경고만 남기고 이어 돈다
